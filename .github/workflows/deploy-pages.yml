# Builds the app and publishes it to GitHub Pages:
#   https://<user>.github.io/<repo>/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [clean-Web-React]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback so deep links like /artist/... work
        run: cp dist/vibeSong/browser/index.html dist/vibeSong/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vibeSong/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
