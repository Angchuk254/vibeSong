# Runs the unit tests and a production build on every push and pull request,
# so a change that breaks the app is caught before it's deployed.
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
