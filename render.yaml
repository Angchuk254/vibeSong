# Render Blueprint — hosts YakBeats as a free static site.
# In Render: New + → Blueprint → pick the Angchuk254/yakbeats repo.
# The site name "yakbeats" gives https://yakbeats.onrender.com
# (Render adds a short suffix if that name is already taken).
services:
  - type: web
    runtime: static
    name: yakbeats
    repo: https://github.com/Angchuk254/yakbeats
    # Render builds and redeploys on every push to the main branch
    branch: clean-Web-React
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    buildCommand: npm ci --include=dev && npx ng build
    staticPublishPath: dist/vibeSong/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Single-page app: any page path (e.g. /artist/…) is served by index.html.
      # Render only applies this when no real file matches the path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Files that announce new versions must never be cached, so updates arrive
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /ngsw.json
        name: Cache-Control
        value: no-cache
      - path: /ngsw-worker.js
        name: Cache-Control
        value: no-cache
      - path: /safety-worker.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Built code has a content hash in its name, so it can be cached forever
      - path: /chunk-*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /main-*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /styles-*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Basic hardening
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
